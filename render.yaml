services:
  - type: web
    name: casa-governance-api
    runtime: python
    rootDir: apps/control-plane
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn governance_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: casa-postgres
          property: connectionString

  - type: web
    name: casa-flagship
    runtime: node
    rootDir: apps/flagship
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEV_LOGIN
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: casa-postgres
          property: connectionString
      - key: CASA_GOVERNANCE_API_URL
        fromService:
          type: web
          name: casa-governance-api
          property: hostport

databases:
  - name: casa-postgres
    databaseName: casa
    user: casa
    plan: basic-256mb
    ipAllowList: []
